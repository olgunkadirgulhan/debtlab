name: shorts
on:
  schedule:
    # 3 videos/day at US viewing times (EDT). MAX_PER_DAY in run.py is the hard cap.
    - cron: "0 13 * * *"   # 09:00 ET / 16:00 TR
    - cron: "0 17 * * *"   # 13:00 ET / 20:00 TR
    - cron: "0 23 * * *"   # 19:00 ET / 02:00 TR
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  make-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: youtube/requirements.txt
      - name: Cache TTS model
        uses: actions/cache@v4
        with:
          path: ~/.cache/debtlab
          key: kokoro-v1.0
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: pip install -r youtube/requirements.txt
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          MAX_PER_DAY: ${{ vars.MAX_PER_DAY }}
        run: python youtube/run.py
      - name: Keep video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-${{ github.run_id }}
          path: youtube/out/*/video.mp4
          retention-days: 5
          if-no-files-found: ignore
      - name: Commit log
        if: always()
        run: |
          git config user.name "debtlab-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A youtube/queue/ || true
          git add youtube/published.csv || true
          git diff --cached --quiet && exit 0
          git commit -m "short: $(date -u +%F-%H%M)"
          git pull --rebase
          git push
